#  flutter pub add flutter_native_splash
#  dart run flutter_native_splash:create --path=flutter_native_splash.yaml

flutter_native_splash:
  # Solid dark bridge that matches the motion splash background.
  color: "#202020"
  color_dark: "#202020"
  image: native_splash/splash_icon.png
  image_dark: native_splash/splash_icon.png
  android_12:
    # 1152x1152 with logo inside the 768px safe circle so Android does not clip it.
    image: native_splash/android12_splash_icon.png
    color: "#202020"
    color_dark: "#202020"
    image_dark: native_splash/android12_splash_icon.png
  web: false
